    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --main-color: #ff4500;
            --main-color-rgb: 255, 69, 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background-image: radial-gradient(circle at 50% 50%, rgba(var(--main-color-rgb), 0.15) 0%, transparent 75%);
        }

        /* Cabecera marca */
        .top-brand {
            position: absolute;
            top: 25px;
            left: 25px;
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.75rem, 2.2vw, 1rem);
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
        }

        /* Selector Vol. 1 & Vol. 2 arriba a la derecha */
        .vol-selector {
            position: fixed;
            top: 20px;
            right: 25px;
            display: flex;
            gap: 14px;
            align-items: center;
            z-index: 1000;
        }

        .vol-btn {
            display: block;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: all 0.3s cubic-bezier(0.17, 0.85, 0.43, 1);
            background-color: #111111;
        }

        .vol-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .vol-btn:hover {
            border-color: var(--main-color);
            transform: scale(1.12);
            box-shadow: 0 0 18px rgba(var(--main-color-rgb), 0.8);
        }

        /* Efectos Neón y Tipografía */
        .neon-accent {
            color: var(--main-color);
            text-shadow: 0 0 10px rgba(var(--main-color-rgb), 0.8),
                         0 0 25px rgba(var(--main-color-rgb), 0.6),
                         0 0 45px rgba(var(--main-color-rgb), 0.3);
            animation: terminalPulse 2.5s infinite alternate ease-in-out;
        }

        .glow-white {
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6),
                         0 0 25px rgba(255, 255, 255, 0.4);
        }

        .hero-title {
            font-size: clamp(2.2rem, 7vw, 5.5rem);
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: -1px;
            line-height: 1.1;
            padding: 0 20px;
            max-width: 1000px;
        }

        .blink-cursor {
            color: var(--main-color);
            font-family: 'Space Mono', monospace;
            font-weight: 900;
            animation: cursorBlink 1s step-end infinite;
        }

        @keyframes terminalPulse {
            0% { text-shadow: 0 0 8px rgba(var(--main-color-rgb), 0.6), 0 0 15px rgba(var(--main-color-rgb), 0.3); }
            100% { text-shadow: 0 0 15px var(--main-color), 0 0 30px var(--main-color), 0 0 45px rgba(var(--main-color-rgb), 0.6); }
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Botón estilo Vol. 2 optimizado para móviles */
        .neon-btn-secondary {
            display: inline-block;
            font-size: clamp(0.85rem, 3.8vw, 1.1rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--main-color);
            text-decoration: none;
            padding: 16px 28px;
            background: rgba(var(--main-color-rgb), 0.03);
            border: 2px dashed var(--main-color);
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(var(--main-color-rgb), 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-top: 35px;
            max-width: 90vw;
            white-space: nowrap;
        }

        .neon-btn-secondary:hover {
            background: rgba(var(--main-color-rgb), 0.15);
            color: #ffffff;
            border-style: solid;
            box-shadow: 0 0 30px rgba(var(--main-color-rgb), 0.5);

        /* Pie de página */

            bottom: 15px;
            left: 15px;

            display: flex;
            justify-content: space-between;
            align-items: flex-end;

            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);

            pointer-events: none;
            line-height: 1.4;

        /* CONTENEDOR JUEGO CUBATA VOL. 3 */

        .btn-exit-game {

        #cubata-canvas-play {

        .pour-control-area {
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 15010;
        }

        .btn-pour-hold {
            width: 90%;
            max-width: 400px;
            padding: 22px;
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(var(--main-color-rgb), 0.4) 0%, rgba(var(--main-color-rgb), 0.1) 100%);

        }

        .btn-pour-hold:active, .btn-pour-hold.pouring {
            transform: scale(0.97);
            background: var(--main-color);
            color: #000000;
            box-shadow: 0 0 45px rgba(var(--main-color-rgb), 0.9);
        }

        .pour-hint {
            margin-top: 10px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Pantalla Game Over Minijuego */
        #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 15020;
            background: rgba(10, 10, 10, 0.96);
            padding: 40px 30px;
            border: 2px dashed var(--main-color);
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0,0,0,1), 0 0 30px rgba(var(--main-color-rgb), 0.3);
            width: 90%;
            max-width: 480px;
            display: none;
        }

        #game-over-screen.active { display: block; }

        #game-over-screen h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            font-size: 2.2rem;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        #final-score {
            font-size: 1.4rem;
            margin-bottom: 8px;
            font-family: 'Space Mono', monospace;
            color: var(--main-color);
        }

        #high-score-text {
            font-size: 0.9rem;
            margin-bottom: 18px;
            font-family: 'Space Mono', monospace;
            color: #888888;
        }

        #final-message {
            font-size: 1.05rem;
            color: #cccccc;
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: 500;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnHype = document.getElementById('btn-hype-vol3');
            const gameModal = document.getElementById('game-modal');
            const btnExit = document.getElementById('btn-exit-game');
            const btnRestart = document.getElementById('btn-restart-game');
            const btnPour = document.getElementById('btn-pour-hold');
            const scoreBadge = document.getElementById('game-score-badge');
            const gameOverScreen = document.getElementById('game-over-screen');
            const finalScoreText = document.getElementById('final-score');
            const highScoreText = document.getElementById('high-score-text');
            const finalMsgText = document.getElementById('final-message');
            const goTitle = document.getElementById('go-title');

            const canvas = document.getElementById('cubata-canvas-play');
            const ctx = canvas ? canvas.getContext('2d') : null;

            let score = 0;
            let highScore = 0;
            let isPouring = false;
            let liquidLevel = 0;
            let gameRunning = false;
            let roundState = 'READY';
            let animReqId = null;

            let iceCubes = [
                { xRel: -0.25, yOffset: 0, size: 28, rot: 0.2 },
                { xRel: 0.15, yOffset: -10, size: 34, rot: -0.3 },
                { xRel: 0.0, yOffset: 12, size: 24, rot: 0.5 }
            ];

            let particles = [];
            let bubbles = [];

            function resizeCanvas() {
                if (!canvas || !gameModal) return;
                const rect = canvas.getBoundingClientRect();
                const w = Math.floor(rect.width || canvas.clientWidth || window.innerWidth);
                const h = Math.floor(rect.height || canvas.clientHeight || (window.innerHeight - 200));
                if (w > 0 && h > 0) {
                    canvas.width = w;
                    canvas.height = h;
                }
            }
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

            function getDifficulty() {
                const fillSpeed = 0.45 + (score * 0.08) + (Math.sin(score * 0.7) * 0.03);
                const minTarget = Math.min(93, 75 + Math.floor(score * 1.2));
                const maxTarget = 98.5;

                return { fillSpeed, minTarget, maxTarget };
            }

            function openGame() {
                gameModal.classList.add('active');
                document.body.style.overflow = 'hidden';
                if (typeof gtag === 'function') {
                    gtag('event', 'vol3_game_start');
                }
                score = 0;
                highScore = parseInt(localStorage.getItem('ph_cubata_highscore') || '0', 10);
                setTimeout(() => {
                    resizeCanvas();
                    startRound();
                    gameRunning = true;
                    loop();
                }, 50);
            }

            function closeGame() {
                gameRunning = false;
                gameModal.classList.remove('active');
                document.body.style.overflow = '';
                if (animReqId) cancelAnimationFrame(animReqId);
                if (typeof gtag === 'function') {
                    gtag('event', 'vol3_game_exit', { final_score: score });
                }
            }

            function restartGame() {
                score = 0;
                startRound();
            }

            function startRound() {
                liquidLevel = 0;
                isPouring = false;
                roundState = 'READY';
                particles = [];
                bubbles = [];
                gameOverScreen.classList.remove('active');
                btnPour.classList.remove('pouring');
                scoreBadge.innerText = `CUBATAS: ${score}`;
                resizeCanvas();
            }

            function startPouring() {
                if (roundState === 'READY' || roundState === 'POURING') {
                    isPouring = true;
                    roundState = 'POURING';
                    btnPour.classList.add('pouring');
                }
            }

            function stopPouring() {
                if (roundState === 'POURING') {
                    isPouring = false;
                    btnPour.classList.remove('pouring');
                    evaluatePour();
                }
            }

            function evaluatePour() {
                roundState = 'EVALUATING';
                const { minTarget, maxTarget } = getDifficulty();

                if (liquidLevel > 100) {
                    triggerOverflowAnimation();
                } else if (liquidLevel >= minTarget && liquidLevel <= maxTarget) {
                    roundState = 'SUCCESS';
                    score++;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('ph_cubata_highscore', highScore.toString());
                    }
                    scoreBadge.innerText = `CUBATAS: ${score}`;
                    if (typeof gtag === 'function') {
                        gtag('event', 'vol3_cubata_success', { score: score });
                    }

                    setTimeout(() => {
                        if (gameRunning) startRound();
                    }, 900);
                } else {
                    triggerGameOver('RATA / MEDIO VACÍO', `Has llenado el vaso solo un ${Math.floor(liquidLevel)}%. En Pablo's House no servimos cubatas de rata.`);
                }
            }

            function triggerOverflowAnimation() {
                roundState = 'GAMEOVER';
                const { glassTopY, glassLeftX, glassRightX } = getGlassDimensions();
                for (let i = 0; i < 60; i++) {
                    const side = Math.random() > 0.5 ? glassLeftX : glassRightX;
                    particles.push({
                        x: side,
                        y: glassTopY,
                        vx: (side === glassLeftX ? -1 : 1) * (Math.random() * 8 + 2),
                        vy: -Math.random() * 8 - 2,
                        size: Math.random() * 6 + 3,
                        alpha: 1,
                        color: Math.random() > 0.4 ? '#ff4500' : '#ffaa00'
                    });
                }

                setTimeout(() => {
                    triggerGameOver('¡SE TE HA DERRAMADO!', 'Has querido apurar tanto que has tirado el cubata al suelo. ¡A limpiar!');
                }, 600);
            }

            function triggerGameOver(title, msg) {
                roundState = 'GAMEOVER';
                goTitle.innerText = title;
                finalScoreText.innerText = `Cubatas seguidos: ${score}`;
                highScoreText.innerText = `Récord de la sesión: ${highScore}`;
                finalMsgText.innerText = msg;
                gameOverScreen.classList.add('active');

                if (typeof gtag === 'function') {
                    gtag('event', 'vol3_game_over', { score: score, high_score: highScore });
                }
            }

            function getGlassDimensions() {
                const w = canvas.width;
                const h = canvas.height;
                const glassH = Math.min(h * 0.52, 320);
                const glassBottomY = h * 0.78;
                const glassTopY = glassBottomY - glassH;
                const topW = Math.min(w * 0.55, 210);
                const bottomW = topW * 0.72;
                const centerX = w / 2;
                const glassLeftX = centerX - topW / 2;
                const glassRightX = centerX + topW / 2;

                return { w, h, glassH, glassBottomY, glassTopY, topW, bottomW, centerX, glassLeftX, glassRightX };
            }

            function update() {
                if (!gameRunning) return;

                const { fillSpeed } = getDifficulty();

                if (isPouring && roundState === 'POURING') {
                    liquidLevel += fillSpeed;

                    if (Math.random() < 0.4) {
                        const { centerX, topW } = getGlassDimensions();
                        bubbles.push({
                            x: centerX + (Math.random() - 0.5) * topW * 0.6,
                            yRel: 0.05,
                            speed: Math.random() * 1.5 + 1,
                            size: Math.random() * 4 + 2,
                            alpha: 0.8
                        });
                    }

                    if (liquidLevel > 105) {
                        isPouring = false;
                        btnPour.classList.remove('pouring');
                        evaluatePour();
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.4;
                    p.alpha -= 0.02;
                    if (p.alpha <= 0) particles.splice(i, 1);
                }

                for (let i = bubbles.length - 1; i >= 0; i--) {
                    const b = bubbles[i];
                    b.yRel += b.speed * 0.008;
                    b.alpha -= 0.01;
                    if (b.yRel >= 1 || b.alpha <= 0) bubbles.splice(i, 1);
                }
            }

            function draw() {
                if (!ctx || !canvas) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const { glassH, glassBottomY, glassTopY, topW, bottomW, centerX, glassLeftX, glassRightX } = getGlassDimensions();
                const { minTarget, maxTarget } = getDifficulty();

                const tapY = Math.max(20, glassTopY - 70);
                ctx.save();
                ctx.fillStyle = '#ff4500';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff4500';
                ctx.fillRect(centerX - 12, tapY - 15, 24, 15);
                ctx.restore();

                if (isPouring || (roundState === 'POURING' && liquidLevel > 0)) {
                    const currentLiquidY = glassBottomY - (glassH * Math.min(1.0, liquidLevel / 100));
                    ctx.save();
                    const streamGrad = ctx.createLinearGradient(centerX - 8, 0, centerX + 8, 0);
                    streamGrad.addColorStop(0, 'rgba(255, 69, 0, 0.9)');
                    streamGrad.addColorStop(0.5, 'rgba(255, 170, 0, 0.95)');
                    streamGrad.addColorStop(1, 'rgba(255, 69, 0, 0.9)');
                    ctx.fillStyle = streamGrad;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ff4500';
                    ctx.fillRect(centerX - 7, tapY, 14, Math.max(0, currentLiquidY - tapY));
                    ctx.restore();
                }

                const glassBottomLeftX = centerX - bottomW / 2;
                const glassBottomRightX = centerX + bottomW / 2;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(glassLeftX, glassTopY);
                ctx.lineTo(glassRightX, glassTopY);
                ctx.lineTo(glassBottomRightX, glassBottomY);
                ctx.lineTo(glassBottomLeftX, glassBottomY);
                ctx.closePath();
                ctx.fillStyle = 'rgba(20, 20, 25, 0.65)';
                ctx.fill();

                ctx.save();
                ctx.clip();

                if (liquidLevel > 0) {
                    const fillHeight = glassH * (liquidLevel / 100);
                    const liquidY = glassBottomY - fillHeight;

                    const liqGrad = ctx.createLinearGradient(0, glassBottomY, 0, glassTopY);
                    liqGrad.addColorStop(0, '#991b00');
                    liqGrad.addColorStop(0.5, '#ff4500');
                    liqGrad.addColorStop(1, '#ffaa00');

                    ctx.fillStyle = liqGrad;
                    ctx.fillRect(centerX - topW, liquidY, topW * 2, fillHeight + 50);

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ffffff';
                    ctx.fillRect(centerX - topW, liquidY - 2, topW * 2, 4);

                    iceCubes.forEach(cube => {
                        const cubeY = glassBottomY - Math.min(fillHeight * 0.85, fillHeight - 20) + cube.yOffset;
                        const cubeX = centerX + (cube.xRel * topW);
                        if (cubeY < glassBottomY && cubeY > liquidY - 15) {
                            ctx.save();
                            ctx.translate(cubeX, cubeY);
                            ctx.rotate(cube.rot);
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                            ctx.lineWidth = 1.5;
                            ctx.fillRect(-cube.size / 2, -cube.size / 2, cube.size, cube.size);
                            ctx.strokeRect(-cube.size / 2, -cube.size / 2, cube.size, cube.size);
                            ctx.restore();
                        }
                    });

                    bubbles.forEach(b => {
                        const bY = glassBottomY - (fillHeight * b.yRel);
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(b.x, bY, b.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${b.alpha})`;
                        ctx.fill();
                        ctx.restore();
                    });
                }
                ctx.restore();

                const minTargetY = glassBottomY - (glassH * (minTarget / 100));
                const maxTargetY = glassBottomY - (glassH * (maxTarget / 100));
                const targetH = minTargetY - maxTargetY;

                ctx.save();
                ctx.fillStyle = 'rgba(255, 69, 0, 0.22)';
                ctx.fillRect(glassLeftX - 15, maxTargetY, topW + 30, targetH);

                ctx.strokeStyle = '#ff4500';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff4500';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 4]);

                ctx.beginPath();
                ctx.moveTo(glassLeftX - 20, minTargetY);
                ctx.lineTo(glassRightX + 20, minTargetY);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(glassLeftX - 20, maxTargetY);
                ctx.lineTo(glassRightX + 20, maxTargetY);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = '#ff8255';
                ctx.font = '700 11px "Space Mono", monospace';
                ctx.fillText('LÍMITE CUBATA', glassRightX + 25, maxTargetY + targetH / 2 + 4);
                ctx.restore();

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(glassLeftX, glassTopY);
                ctx.lineTo(glassRightX, glassTopY);
                ctx.lineTo(glassBottomRightX, glassBottomY);
                ctx.lineTo(glassBottomLeftX, glassBottomY);
                ctx.closePath();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3.5;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffffff';
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(glassLeftX + 10, glassTopY + 15);
                ctx.lineTo(glassBottomLeftX + 8, glassBottomY - 15);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                if (roundState === 'SUCCESS') {
                    ctx.save();
                    ctx.font = '900 2.2rem "Anton", sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ff4500';
                    ctx.textAlign = 'center';
                    ctx.fillText('¡CUBATA PERFECTO! +1', centerX, glassTopY - 30);
                    ctx.restore();
                }

                particles.forEach(p => {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = p.color;
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fill();
                    ctx.restore();
                });
            }

            function loop() {
                if (!gameRunning) return;
                update();
                draw();
                animReqId = requestAnimationFrame(loop);
            }

            // CONTROLES
            if (btnHype) btnHype.addEventListener('click', openGame);
            if (btnExit) btnExit.addEventListener('click', closeGame);
            if (btnRestart) btnRestart.addEventListener('click', restartGame);

            // Controles táctiles compatibles con iOS y Android
            if (btnPour) {
                btnPour.addEventListener('contextmenu', (e) => e.preventDefault());

                const handleStart = (e) => {
                    if (e && e.cancelable) e.preventDefault();
                    startPouring();
                };

                const handleEnd = (e) => {
                    if (e && e.cancelable) e.preventDefault();
                    stopPouring();
                };

                // Pointer Events (Chrome, Firefox, Edge, Android, Safari iOS 13+)
                btnPour.addEventListener('pointerdown', handleStart, { passive: false });
                btnPour.addEventListener('pointerup', handleEnd, { passive: false });
                btnPour.addEventListener('pointercancel', handleEnd, { passive: false });
                btnPour.addEventListener('pointerleave', () => {
                    if (isPouring) stopPouring();
                }, { passive: false });

                // Touch Events de respaldo (Safari iOS legacy)
                btnPour.addEventListener('touchstart', handleStart, { passive: false });
                btnPour.addEventListener('touchend', handleEnd, { passive: false });
                btnPour.addEventListener('touchcancel', handleEnd, { passive: false });
            }

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && gameRunning && (roundState === 'READY' || roundState === 'POURING') && !isPouring) {
                    e.preventDefault();
                    startPouring();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space' && gameRunning && isPouring) {
                    e.preventDefault();
                    stopPouring();
                }
            });
        });
    </script>

</body>
