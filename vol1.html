<html lang="es">
<head>

    <meta name="theme-color" content="#ff4500">
    <meta name="description" content="Pablo's House - Vol. 1 (THE OG)">
    <title>Pablo's House: Vol. 1 - THE OG</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="LogoUbi.png">

    <!-- META ETIQUETAS OG -->
    <meta property="og:title" content="PABLO'S HOUSE: VOL. 1">
    <meta property="og:description" content="THE OG">
    <meta property="og:image" content="Logo.png">
    <meta property="og:type" content="website">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z5XB883KRF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

      gtag('js', new Date());

      gtag('config', 'G-Z5XB883KRF');

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --main-color: #ff4500;
            --main-color-rgb: 255, 69, 0;
            --og-color: #b2f4f3;
            --og-color-rgb: 178, 244, 243;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background-image: radial-gradient(circle at 50% 50%, rgba(var(--main-color-rgb), 0.15) 0%, transparent 75%);
        }

        /* CABECERA FLOTANTE CON GRID (IDÉNTICA A VOL 2) */
        .sticky-header-brand {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0) 100%);
            z-index: 1000;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: baseline;
            text-decoration: none;
            cursor: pointer;
        }

        .sticky-brand-pablo {
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.65rem, 2.2vw, 0.95rem);
            letter-spacing: 0.1em;
            color: #ffffff;
            opacity: 0.8;
            text-transform: uppercase;
            justify-self: end;
            padding-right: 12px;
        }

        .sticky-brand-comeback {
            font-family: 'Anton', sans-serif;
            font-size: clamp(1.2rem, 4vw, 1.7rem);
            letter-spacing: 1px;
            color: #ff8255;
            text-transform: uppercase;
            justify-self: center;
            animation: terminalPulse 2.5s infinite alternate ease-in-out;
        }

        .sticky-right-container {
            justify-self: start;
            padding-left: 4px;
        }

        .sticky-brand-vol {
            font-family: 'Anton', sans-serif;
            font-size: clamp(0.55rem, 1.8vw, 0.8rem);
            vertical-align: super;
            color: var(--main-color);
            letter-spacing: 0.5px;
        }

        /* Selector Vol. 1 & Vol. 2 arriba a la derecha */
        .vol-selector {
            position: fixed;
            top: 20px;
            right: 25px;
            display: flex;
            gap: 14px;
            align-items: center;
            z-index: 1001;
        }

        .vol-btn {
            display: block;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            transition: all 0.3s cubic-bezier(0.17, 0.85, 0.43, 1);
            background-color: #111111;
        }

        .vol-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .vol-btn:hover, .vol-btn.active {
            border-color: var(--main-color);
            transform: scale(1.12);
            box-shadow: 0 0 18px rgba(var(--main-color-rgb), 0.8);
        }

        /* Efectos Neón y Tipografía */
        .neon-accent-og {
            color: var(--og-color);
            text-shadow: 0 0 10px rgba(var(--og-color-rgb), 0.8),
                         0 0 25px rgba(var(--og-color-rgb), 0.6),
                         0 0 45px rgba(var(--og-color-rgb), 0.3);
            animation: terminalPulseOG 2.5s infinite alternate ease-in-out;
        }

        .hero-title {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: -1px;
            line-height: 1.1;
            padding: 0 20px;
            max-width: 1000px;
        }

        .sub-tag {
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.8rem, 2.5vw, 1.2rem);
            letter-spacing: 0.3em;
            color: #888888;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-align: center;
        }

        .blink-cursor-og {
            color: var(--og-color);
            font-family: 'Space Mono', monospace;
            font-weight: 900;
            animation: cursorBlink 1s step-end infinite;
        }

        @keyframes terminalPulse {
            0% { text-shadow: 0 0 8px rgba(var(--main-color-rgb), 0.6), 0 0 15px rgba(var(--main-color-rgb), 0.3); }
            100% { text-shadow: 0 0 15px var(--main-color), 0 0 30px var(--main-color), 0 0 45px rgba(var(--main-color-rgb), 0.6); }
        }

        @keyframes terminalPulseOG {
            0% { text-shadow: 0 0 8px rgba(var(--og-color-rgb), 0.6), 0 0 15px rgba(var(--og-color-rgb), 0.3); }
            100% { text-shadow: 0 0 15px var(--og-color), 0 0 30px var(--og-color), 0 0 45px rgba(var(--og-color-rgb), 0.6); }
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Pie de página (Igual que Vol. 2) */
        .disclaimer-footer {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
            pointer-events: none;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- CABECERA FLOTANTE CON ENLACE A INDEX.HTML -->
    <a href="index.html" class="sticky-header-brand">
        <span class="sticky-brand-pablo">PABLO'S HOUSE</span>
        <span class="sticky-brand-comeback">THE OG</span>
        <div class="sticky-right-container">
            <sup class="sticky-brand-vol">&nbsp;VOL. 1</sup>
        </div>
    </a>

    <!-- SELECTOR DE VOLÚMENES -->
    <nav class="vol-selector">
        <a href="vol1.html" class="vol-btn active" title="Volumen 1">
            <img src="vol1.png" alt="Vol. 1">
        </a>
        <a href="vol2.html" class="vol-btn" title="Volumen 2">
            <img src="vol2.png" alt="Vol. 2">
        </a>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main style="text-align: center;">
        <div class="sub-tag">[ 28/08/2021 ]</div>
        <h1 class="hero-title neon-accent-og">
            THE OG<span class="blink-cursor-og">_</span>
        </h1>
